# Hands-off Homebrew bump: after the Release workflow succeeds, read the checksums the release job
# uploaded, regenerate the formula from the committed template, and open a PR to the tap repo.
#
# Uses `workflow_run` (NOT release:published) because a release created inside the Release workflow
# by the built-in GITHUB_TOKEN does not emit events that start new workflows.
#
# Requires ONE secret: TAP_PAT — a fine-grained PAT with Contents:write + Pull-requests:write on
# Servant-Software-LLC/homebrew-tap.
name: Bump Homebrew tap

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to bump to (e.g. v0.1.0-preview.1)"
        required: true

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    steps:
      - name: Checkout Charter at the released commit (for the formula template)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Resolve tag + version
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}"
          [ -n "$TAG" ] || { echo "no tag resolved" >&2; exit 1; }
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Read sha256 for the four Homebrew RIDs
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="${{ steps.v.outputs.tag }}"; VER="${{ steps.v.outputs.version }}"
          d="$RUNNER_TEMP/sha"; mkdir -p "$d"
          read_sha() {
            gh release download "$TAG" -R "$REPO" -p "charter-$VER-$1.tar.gz.sha256" -D "$d" --clobber
            awk '{print $1}' "$d/charter-$VER-$1.tar.gz.sha256"
          }
          {
            echo "osx_arm64=$(read_sha osx-arm64)"
            echo "osx_x64=$(read_sha osx-x64)"
            echo "linux_arm64=$(read_sha linux-arm64)"
            echo "linux_x64=$(read_sha linux-x64)"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout the tap
        uses: actions/checkout@v6
        with:
          repository: Servant-Software-LLC/homebrew-tap
          token: ${{ secrets.TAP_PAT }}
          path: tap

      - name: Render formula from template
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          sed \
            -e "s/@VERSION@/${{ steps.v.outputs.version }}/g" \
            -e "s/@SHA_OSX_ARM64@/${{ steps.sha.outputs.osx_arm64 }}/g" \
            -e "s/@SHA_OSX_X64@/${{ steps.sha.outputs.osx_x64 }}/g" \
            -e "s/@SHA_LINUX_ARM64@/${{ steps.sha.outputs.linux_arm64 }}/g" \
            -e "s/@SHA_LINUX_X64@/${{ steps.sha.outputs.linux_x64 }}/g" \
            .github/templates/charter.rb.tmpl > tap/Formula/charter.rb
          echo "----- rendered formula -----"; cat tap/Formula/charter.rb

      # PUBLISH DIRECTLY — do not open a PR. (#95)
      #
      # This step used to `peter-evans/create-pull-request`, and nothing ever merged the result. By
      # 2026-08-01 the tap had 21 open bump PRs: `charter.rb` was pinned at v0.1.0 while the current release
      # was 0.8.0, and `guardrails.rb` did not exist in the tap AT ALL. `brew install` was serving a version
      # eight releases stale, and the whole time the release workflow reported success — it builds the
      # binaries, uploads the assets, and opens the PR. Every step it is asked to do succeeds. The publish
      # simply never completes.
      #
      # The PR gate bought nothing to offset that. The formula is generated from a template by substituting a
      # version and four checksums read straight from the release's own .sha256 assets — there is no human
      # judgement in it, nothing to review, and nobody staffed to review it. It was a publish step wearing a
      # code-review costume.
      - name: Publish the formula to the tap
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- Formula/charter.rb; then
            echo "Formula already at ${{ steps.v.outputs.version }} — nothing to publish."
            exit 0
          fi

          git add Formula/charter.rb
          git commit -m "charter ${{ steps.v.outputs.version }}"

          # A concurrent guardrails bump can land between our checkout and this push; rebase and retry rather
          # than fail a release for a race on a two-formula repo.
          for attempt in 1 2 3; do
            if git push; then
              echo "Published charter ${{ steps.v.outputs.version }} to the tap."
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto the tap's tip and retrying"
            git pull --rebase
          done
          echo "::error::Could not publish the formula to the tap after 3 attempts."
          exit 1

  # The check the PR gate was only pretending to be. A bad checksum or a malformed template is the ACTUAL
  # failure mode for a formula, and an unmerged PR never caught either — this does, loudly, right after
  # publishing. Runs on macOS because that is the platform the tap exists to serve; a Linux `brew install`
  # would exercise a different bottle and prove the wrong thing.
  #
  # This job runs AFTER the release is already published, so failing it cannot unpublish anything — that is
  # the point. A red box here means "the tap is serving something broken", which is exactly the state that
  # went unnoticed for 21 releases.
  verify:
    name: verify the tap installs (macos)
    needs: bump
    runs-on: macos-latest
    steps:
      - name: brew install from the tap
        run: |
          set -euo pipefail
          brew tap servant-software-llc/tap
          brew audit --strict --formula servant-software-llc/tap/charter \
            || echo "::warning::brew audit reported issues — see above (not fatal)."
          brew install servant-software-llc/tap/charter
          charter --version
