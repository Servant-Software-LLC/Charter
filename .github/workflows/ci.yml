name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build Charter.sln -c Release
      - name: Install Playwright browser (Chromium)
        # The generated playwright.ps1 (present after Build) installs the Chromium the headless-browser
        # acceptance test in Charter.Browser.Tests drives. `--with-deps` also pulls the OS libraries on Linux;
        # it is a no-op on Windows/macOS. If a browser cannot be installed on some host, the browser test SKIPS
        # cleanly (Skip.If) while the deterministic server-side guards still run on every OS.
        shell: pwsh
        run: ./tests/Charter.Browser.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Test
        run: dotnet test Charter.sln -c Release --no-build

  # #110 — the review loop on WEBKIT, the engine macOS reviewers actually get.
  #
  # `charter review` hands the URL to the platform's DEFAULT browser (Process.Start("open", url) on macOS), so
  # on a stock Mac that is Safari. Until now every browser test was Chromium-only, which left the entire
  # annotation loop unverified on a first-class target — and the SDK leans on exactly the APIs where WebKit
  # diverges (getSelection/createRange for text-range anchoring, getBoundingClientRect for hit-testing inside
  # rendered SVG, EventSource for live reload). All of those fail SILENTLY: a comment lands on the wrong text,
  # or the page stops updating, and nothing throws.
  #
  # BLOCKING, not advisory. #111 and #113 are fixed and their in-test quarantines are gone; what remains is a
  # single named skip where PLAYWRIGHT, not the product, cannot do the job on this engine. The gate below
  # allows that one by name and nothing else, so a NEW engine regression fails here immediately.
  #
  # Ubuntu because WebKit runs headless there and it is the cheapest runner; the engine is what is under test,
  # not the OS. Only the browser suite runs — the rest of the solution is engine-independent and already
  # covered three times over by the matrix above.
  webkit:
    name: review loop on WebKit (#110)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build Charter.sln -c Release
      - name: Install Playwright browser (WebKit)
        shell: pwsh
        run: ./tests/Charter.Browser.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps webkit
      - name: Test (browser suite, CHARTER_BROWSER=webkit)
        env:
          CHARTER_BROWSER: webkit
        run: |
          dotnet test tests/Charter.Browser.Tests/Charter.Browser.Tests.csproj -c Release --no-build \
            --logger "console;verbosity=normal" | tee webkit.log
          # These tests SKIP rather than fail when a browser is missing, so a green tick proves nothing on
          # its own: if WebKit silently did not install, EVERY test skips and the run still reports success.
          # That is the exact blindness this job exists to remove.
          #
          # The check is by NAME, not by count. A count threshold rots — it has to be edited every time a
          # skip is added or removed, and a stale one either blocks a legitimate change or waves through a
          # missing engine. The allow-list below states precisely which tests may skip here and why; anything
          # else skipping fails the job, including all of them skipping because the engine never ran.
          #
          # (Each check is written as `! grep ... || fail` rather than `grep ... && fail` — under the default
          # `bash -e` an unmatched grep in an && list leaves a non-zero status that can fail the step on the
          # HAPPY path, which is how the previous version of this gate reported failure when there was none.)
          grep -q "Test Run Successful." webkit.log || { echo "::error::WebKit run was not successful"; exit 1; }
          grep -qE "Passed: +[1-9]" webkit.log || { echo "::error::WebKit reported no passing tests"; exit 1; }
          # Railed_badges_survive_forced_colors (#164): Playwright emulates forced-colors on Chromium ONLY —
          # WebKit rejects the emulation, so running it here would measure an ordinary context and PASS while
          # proving nothing, which is worse than skipping. The test asserts the emulation is really active
          # before it measures, so it cannot go vacuous on Chromium either.
          cat > webkit-allowed-skips.txt <<'ALLOWED'
          Charter.Browser.Tests.ReviewLoopBrowserTests.Railed_badges_survive_forced_colors
          ALLOWED
          sed -i 's/^[[:space:]]*//' webkit-allowed-skips.txt
          grep -oE 'Skipped +[A-Za-z0-9_.]+' webkit.log | sed 's/^Skipped  *//' | sort -u > webkit-skipped.txt
          UNEXPECTED=$(comm -23 webkit-skipped.txt <(sort -u webkit-allowed-skips.txt) || true)
          [ -z "$UNEXPECTED" ] || { echo "::error::WebKit skipped tests outside the allow-list - the engine did not really run, or a quarantine was added without updating this gate: $(echo $UNEXPECTED)"; exit 1; }
