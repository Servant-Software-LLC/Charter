name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build Charter.sln -c Release
      - name: Install Playwright browser (Chromium)
        # The generated playwright.ps1 (present after Build) installs the Chromium the headless-browser
        # acceptance test in Charter.Browser.Tests drives. `--with-deps` also pulls the OS libraries on Linux;
        # it is a no-op on Windows/macOS. If a browser cannot be installed on some host, the browser test SKIPS
        # cleanly (Skip.If) while the deterministic server-side guards still run on every OS.
        shell: pwsh
        run: ./tests/Charter.Browser.Tests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium
      - name: Test
        run: dotnet test Charter.sln -c Release --no-build

  sdk-drift:
    # ADVISORY early-warning leg — not a gate.
    #
    # `global.json` accepts any SDK >= 8.0.100 (rollForward: latestMajor), so a contributor on a
    # current SDK compiles with a newer Roslyn and MSBuild than the pinned 8.0.x legs above.
    # `AnalysisLevel 8.0` pins the SDK's CA analyzer wave but NOT the compiler's own warnings, and
    # TreatWarningsAsErrors is on repo-wide — so a new diagnostic in a future SDK would break a
    # contributor's very first build while every pinned leg stayed green. This job surfaces that
    # here instead of in their terminal.
    #
    # It deliberately installs ONLY the newest SDK and sets DOTNET_ROLL_FORWARD, reproducing the
    # modern-SDK-only contributor machine documented in the README. That makes this job the
    # continuous proof that those README instructions still work.
    #
    # continue-on-error: a new SDK wave is not a code defect and must not block a PR. A red box
    # here means "open an issue", not "fix this PR".
    #
    # Bump dotnet-version when a new major ships — setup-dotnet has no floating "latest".
    name: sdk drift (newest SDK only, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DOTNET_ROLL_FORWARD: LatestMajor
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET (newest major only — no 8.0 runtime present)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Report resolved SDK
        run: dotnet --info
      - name: Build
        run: dotnet build Charter.sln -c Release
      - name: Install Playwright browser (Chromium)
        shell: pwsh
        run: ./tests/Charter.Browser.Tests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium
      - name: Test
        run: dotnet test Charter.sln -c Release --no-build
